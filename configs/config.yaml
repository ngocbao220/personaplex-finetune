# Master Hydra configuration for PersonaPlex fine-tuning
# Sub-configs are located in modular directories: model/, data/, lora/, train/
defaults:
  - model: server
  - data: vietnamese
  - lora: default
  - train: full
  - _self_

seed: 42
duration_sec: 100
profile_steps: false
no_eval: false
free_running_eval_every_steps: 500
free_running_eval_samples: 3
validation_max_samples: 32
user_loss: false

generation:
  use_sampling: true
  temp: 0.8
  temp_text: 0.7
  top_k: 250
  top_k_text: 25
  audio_silence_frame_cnt: 6
