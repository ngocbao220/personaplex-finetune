defaults:
  - model: server
  - data: vietnamese
  - _self_

seed: 42

adapter:
  path: null # Pass the adapter returned by training with --adapter.

# Các tham số lấy mẫu khi sinh: src/personaplex_finetuning/inference.py truyền thẳng vào LMGen
# (xem LMGen.__init__ trong src/moshi/models/lm.py). Được đọc bởi src/tools/inference_smoke.py
# qua generation_from_config(); thiếu khóa thì dùng mặc định Moshi, sai tên khóa hoặc giá trị
# không hợp lệ sẽ báo lỗi ngay (fail fast) trước khi nạp model. Giá trị dùng thật được ghi lại
# trong run.json (khóa "generation" và "generation_settings").
generation:
  use_sampling: false          # true = lấy mẫu ngẫu nhiên theo phân phối xác suất (đa dạng); false = greedy argmax (tất định, dùng cho tests/test_pipeline_smoke.py và benchmark/runner.py)
  temp: 0                  # nhiệt độ cho token ÂM THANH: softmax(logits/temp) rồi top-k; 0.8 = mặc định Moshi; nhỏ hơn -> giọng đều/ổn định, lớn hơn -> đa dạng nhưng dễ vỡ tiếng
  temp_text: 0              # nhiệt độ cho token VĂN BẢN của agent; 0.7 = mặc định Moshi; thấp hơn temp để nội dung chữ ổn định, ít lặp rác
  top_k: 250                  # chỉ giữ 250 token âm thanh khả dĩ nhất trong mỗi codebook Mimi (2048 mục) trước khi lấy mẫu; 0 = tắt top-k, 1 = gần greedy
  top_k_text: 25              # chỉ giữ 25 token văn bản khả dĩ nhất (SentencePiece, vocab 32k) trước khi lấy mẫu; nhỏ -> chữ an toàn hơn, lớn -> phong phú hơn
  audio_silence_frame_cnt: 6  # số frame im lặng chèn giữa system prompt và hội thoại; 1 frame = 1/12.5Hz = 80ms nên 6 frame ≈ 0.48s (~0.5s, giống Moshi: int(0.5 * frame_rate)); agent text = PAD (zero_text_code=3), user audio = frame im lặng, agent audio = sóng sine

# Inference input and evaluation settings
inference:
  filter_num_workers: 64   # CPU workers for prepared-sample validation and chunk overflow filtering.
  sample_id: null          # Tìm sample_id trên mọi manifest đã cấu hình; không phụ thuộc train/validation/test split.
  input_file: null         # WAV/MP3 user audio ngoài; vẫn dùng conditioning từ sample_id nếu không truyền đủ hai prompt riêng.
  voice_prompt: null       # Đường dẫn file audio WAV voice prompt của agent (mẫu giọng); nếu để null sẽ lấy theo sample_id
  text_prompt: null        # Nội dung system text prompt định hướng persona của agent; nếu để null sẽ lấy theo sample_id
  start: null               # Start time in seconds within the selected audio
  window_seconds: 100       # Maximum audio duration to infer
  output_dir: outputs/inference # Mỗi lần chạy lưu riêng trong outputs/inference/infer_<date>/.
