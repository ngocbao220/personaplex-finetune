# Hydra configuration for the Moshi-style fixed-duration PersonaPlex trainer.
defaults:
  - model: local
  - data: otospeech
  - lora: default
  - _self_

seed: 42
duration_sec: 100
sample_number: null
profile_steps: false        # Set true for synchronized phase timing during a short pilot.
free_running_eval_every_steps: 500
free_running_eval_samples: 3
free_running_eval_window_seconds: 30
validation_max_samples: 32
batch_size: 1             # Per GPU; 100-second sequences make large microbatches memory-heavy.
max_steps: 2000

lora:
  enable: true
  rank: 128
  scaling: 2.0
  ft_embed: false

optim:
  lr: 2.0e-6
  weight_decay: 0.1
  pct_start: 0.05

first_codebook_weight_multiplier: 1.0
text_padding_weight: 0.3
log_freq: 1
no_eval: false
ckpt_freq: 100
gradient_checkpointing: true

generation:
  use_sampling: true
  temp: 0.8
  temp_text: 0.7
  top_k: 250
  top_k_text: 25
  audio_silence_frame_cnt: 6

train:
  output_dir: ../runs/moshi-code-style
  gradient_accumulation_steps: 8
  eval_every_steps: 500
  mixed_precision: bf16
  num_workers: 4
  prefetch_factor: 2
  pin_memory: true
  persistent_workers: true
