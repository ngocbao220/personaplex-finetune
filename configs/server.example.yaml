# Copy to server.local.yaml and replace every /mnt or /opt placeholder.
# This file is deliberately not runnable until it references real local assets.
seed: 42
model:
  root: /mnt/models/personaplex-7b-v1
  # Directory that contains the moshi/ Python package.
  source: /opt/personaplex-source
  device: cuda
data:
  manifest: /mnt/processed/train.jsonl
  window_seconds: 30
  shuffle: false
lora:
  rank: 16
  alpha: 32
train:
  # Use a fresh path for each run; existing output directories are rejected.
  output_dir: /mnt/runs/personaplex-overfit-10
  max_steps: 300
  learning_rate: 2.0e-5
