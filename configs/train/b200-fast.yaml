# 2x B200 throughput candidate — validate with profile_steps before a long run.
# Same global batch as train=b200 (4 x 4 x 2 GPUs = 32) so loss curves compare 1:1.
# Drops activation checkpointing (~30% fewer FLOPs): est. ~12-15 GB activations
# per 100 s sample on the 7B temporal transformer -> batch 4 fits in 180 GB.
# If OOM: per_device_batch_size 2 + gradient_accumulation_steps 8.
output_dir: ../runs/b200-fast
max_steps: 2200
learning_rate: 2.0e-5
depformer_learning_rate: 5.0e-5
gradient_accumulation_steps: 4
per_device_batch_size: 4
num_workers: 8
filter_num_workers: 64
prefetch_factor: 4
pin_memory: true
persistent_workers: true
warmup_steps: 100
eval_every_steps: 250
save_every_steps: 250
gradient_checkpointing: false
mixed_precision: bf16
