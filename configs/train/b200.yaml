# NVIDIA B200: keep the proven single-sample model microbatch used on main.
# Accumulation preserves an effective batch of 16 per GPU.
output_dir: ../runs/b200
max_steps: 10000
learning_rate: 2.0e-5
gradient_accumulation_steps: 16
per_device_batch_size: 1
num_workers: 8
prefetch_factor: 4
pin_memory: true
persistent_workers: true
warmup_steps: 500
eval_every_steps: 1000
save_every_steps: 1000
gradient_checkpointing: true
mixed_precision: bf16
