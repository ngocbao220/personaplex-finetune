# 2x B200 (180 GB) — safe baseline. Same memory profile as train-v1, larger
# accumulation and loader prefetch. Global batch = 1 x 16 x 2 GPUs = 32.
# max_steps: ceil(passes * kept_train_chunks / 32); passes = 2 with swap_roles_after_pass.
output_dir: ../runs/b200
max_steps: 2200
learning_rate: 2.0e-5
depformer_learning_rate: 5.0e-5
gradient_accumulation_steps: 16
per_device_batch_size: 1
num_workers: 8
filter_num_workers: 64
prefetch_factor: 4
pin_memory: true
persistent_workers: true
warmup_steps: 100
eval_every_steps: 250
save_every_steps: 250
gradient_checkpointing: true
mixed_precision: bf16
