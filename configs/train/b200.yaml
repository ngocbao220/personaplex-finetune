# NVIDIA B200: larger per-GPU batches keep the GPU busier while retaining
# the full.yaml effective batch size of 16 on a single GPU.
output_dir: ../runs/b200
max_steps: 10000
learning_rate: 2.0e-5
gradient_accumulation_steps: 2
per_device_batch_size: 8
num_workers: 8
prefetch_factor: 4
pin_memory: true
persistent_workers: true
warmup_steps: 500
eval_every_steps: 1000
save_every_steps: 1000
# B200 memory headroom makes activation recomputation unnecessary for this LoRA path.
gradient_checkpointing: false
mixed_precision: bf16
