# PersonaPlex Fine-Tuning Configuration for Full 104-Hour OtoSpeech
seed: 42

model:
  root: /storage-voice/voice/vdt/baottn/personaplex-7b-v1
  source: ../src
  device: cuda

data:
  prepared_dir: /storage-voice/voice/vdt/baottn/personaplex-otospeech-prepared
  window_seconds: 30       # 30-second conversational window
  shuffle: true            # Shuffle conversations during training
  random_crop: true        # Randomly sample windows across full 10-30 min audio
  prompt_aug_prob: 0.3     # 30% chance to sample multi-level prompts (generic/casual/assistant)
  val_ratio: 0.05          # 5% holdout for validation tracking (or use data.val_manifest)

lora:
  rank: 16
  alpha: 32
  qlora: false
  quant_type: nf4

train:
  output_dir: ../runs/train_104h
  max_steps: 10000         # Total training steps
  learning_rate: 2.0e-5
  gradient_accumulation_steps: 8  # Effective batch size = 8
  warmup_steps: 500        # Cosine warmup over first 500 steps
  eval_every_steps: 500    # Evaluate val_loss every 500 steps
  save_every_steps: 500    # Save periodic checkpoint every 500 steps
