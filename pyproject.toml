[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personaplex-finetuning"
version = "0.1.0"
description = "Offline-first PersonaPlex LoRA overfit path for prepared OtoSpeech data"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.30",
  "bitsandbytes>=0.43",
  "hydra-core>=1.3",
  "numpy>=1.26,<2.2",
  "omegaconf>=2.3",
  "PyYAML>=6",
  "protobuf>=3.19.6,<5",
  "safetensors>=0.4",
  "sentencepiece==0.2",
  "sphn>=0.1.4,<0.2",
  "tensorboard>=2.17,<2.19",
  "pyloudnorm>=0.1.1",
  "torch>=2.2,<2.5",
  "tqdm>=4.66",
]

[project.optional-dependencies]
hub = [
  "huggingface-hub[cli]>=0.24,<0.25",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
